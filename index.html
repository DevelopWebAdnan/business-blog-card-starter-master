<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <title>Business Blog Card | devChallenges.io</title>

    <!--You are welcome to delete these styles or modify them in your own stylesheet -->
    <style>
      .lato-regular {
  font-family: "Lato", sans-serif;
  font-weight: 400;
  font-style: normal;
}

.lato-bold {
  font-family: "Lato", sans-serif;
  font-weight: 700;
  font-style: normal;
}
.lato-black {
  font-family: "Lato", sans-serif;
  font-weight: 900;
  font-style: normal;
}

.poppins-bold {
  font-family: "Poppins", sans-serif;
  font-weight: 700;
  font-style: normal;
}

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        font-size: 1rem;
        color: #4A5567;
      }

      .business-blog {
        background-color: #F2F5F9;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 5px dashed gold;
        padding: 150px 0;
      }
      .blog-card {
        background-color: #FFFFFF;
        width: min-content;
      }
      .blog-content {

      }
      /* .blog-content figure { */
      .blog-content {
        background-image: url('resources/white-overlay.svg');
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }
      .blog-title {
        font-size: 1.5rem;
        color: #111729;
      }

      .blog-author {
        display: flex;
      }
      .blog-author img {
        border-radius: 50%;
      }
      .blog-author-info {
        
      }
      .blog-author-name {
        color: #111729;
      }
      .blog-author-job {

      }

      .author-info {
        font-size: 14px;
        text-align: center;
        margin-top: 16px;
        color: rgb(55, 65, 81);
      }

      .author-info a {
        color: rgb(55, 65, 81);
        text-decoration: underline;
      }
    </style>
  </head>
  <body class="lato-regular">
    <main>
      <article>
        <section class="business-blog">
          <div class="blog-card">
            <div class="blog-content">
              <figure><img src="resources/hero-image-1.jpg" alt="hero-image-1" width="418" height="280"></figure>
              <h3 class="blog-title poppins-bold">Perfect solution for small business</h3>
              <p class="blog-description">Small businesses need to generate leads to grow. You can use tools like Ringy.</p>
            </div>
            <hr>
            <div class="blog-author">
              <img src="resources/avatar-image-business-card-1.png" alt="avatar-image-business-card-1" width="58" height="58">
              <div class="blog-author-info">
                <p class="blog-author-name lato-bold">Amy Burgess</p>
                <p class="blog-author-job">Customer Manger, Solution Oy</p>
              </div>
            </div>
          </div>
        </section>
      </article>
    </main>
<footer>
  <div class="author-info">
    Coded by <a href="#">Your Name Here</a> | Challenge by
    <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
      >devChallenges.io</a
    >.
  </div>
</footer>
  </body>
</html>
